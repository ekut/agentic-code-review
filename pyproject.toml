[project]
name = "agentic_code_review"
version = "0.1.0"
description = "Code review using crewAI"
authors = [{ name = "Natty Bumppo", email = "alex@nattybumppo.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==0.203.1",
    "dill",
    "pytest>=7.4.0",
    "hypothesis>=6.92.0",
    "requests>=2.31.0",
]

[project.scripts]
kickoff = "agentic_code_review.main:kickoff"
run_crew = "agentic_code_review.main:kickoff"
plot = "agentic_code_review.main:plot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_code_review"]

[tool.crewai]
type = "flow"

[tool.pytest.ini_options]
testpaths = ["tests"]